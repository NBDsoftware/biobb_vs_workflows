# Conda environment for running the biobb_vs_workflows tutorial on a LOCAL Jupyter.
# For Google Colab use colab_environment.yml instead.
name: biobb_vs_tutorial
channels:
  - conda-forge
  - bioconda
  - salilab
dependencies:
  - python=3.11            # tested config; vina/openbabel also build on 3.12+ but 3.11 is what we verify
  - pip
  # --- BioBB packages (same set the production env uses) ---
  - biobb_common>=5.3.1
  - biobb_structure_utils>=5.3.0
  - biobb_gromacs>=5.3.0   # pulls gromacs (2025.4)
  - biobb_io>=5.3.0
  - biobb_vs>=5.3.0        # pulls in vina + fpocket automatically
  - biobb_chemistry>=5.3.0
  # --- Science libs used directly by the workflows ---
  - ambertools             # cpptraj binary for cpptraj_convert (was transitive via conda biobb_analysis)
  - mdanalysis
  - openbabel==3.1.1
  - biopython
  # --- Notebook kernel + visualization (host + run the notebook from this env) ---
  - jupyter
  - ipykernel
  - ipywidgets
  - nglview<=4
  - plotly
  - numpy
  - pandas
  - pip:
    # biobb_analysis via pip, NOT conda: its conda recipe requires gromacs>=2026, which needs
    # libxml2>=2.14, while openbabel 3.1.1 (hard-pinned by biobb_chemistry) caps libxml2<2.14.
    # The PyPI package only pins biobb-common==5.3.1 and runs fine on gromacs 2025.x.
    - biobb_analysis>=5.3.0
    - biobb_vs_workflows @ git+https://github.com/NBDsoftware/biobb_vs_workflows.git

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biobb_vs_workflows"
version = "0.0.1"
requires-python = ">=3.11,<3.12"   # tested config; conda envs pin the same
dependencies = [
    "biobb_common>=5.3.1",
    "biobb_structure_utils>=5.3.0",
    "biobb_io>=5.3.0",
    "biobb_vs>=5.3.0",
    "biobb_gromacs>=5.3.0",
    "biobb_chemistry>=5.3.0",
    "biobb_analysis>=5.3.0",
    "mdanalysis",
    "biopython",
]

[project.scripts]
cavity_analysis = "biobb_vs_workflows.cavity_analysis.cavity_analysis:main"
vs_autodock      = "biobb_vs_workflows.vs_autodock.vs_autodock:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["biobb_vs_workflows*"]
